# Configuración de Render para Capital Clara
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: capital-clara
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: node dist/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 3000
